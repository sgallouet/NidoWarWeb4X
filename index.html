<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NidoWar Web4X</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <canvas id="world" aria-label="NidoWar isometric world preview"></canvas>
    <div id="loading" class="loading" role="status" aria-live="polite">Loading</div>
    <div id="worldControls" class="hud is-folded" aria-label="world controls">
      <button id="controlsToggle" type="button" title="Controls" aria-label="Open controls" aria-expanded="false">≡</button>
      <button id="reroll" type="button" title="New scene" aria-label="New scene">R</button>
    </div>
    <section class="perf-monitor" aria-label="Frame generation time">
      <span class="perf-value"><span id="frameMs">--</span> ms</span>
      <canvas id="perfGraph" aria-hidden="true"></canvas>
    </section>
    <div id="worldGroup" class="world-group" hidden aria-label="Selected army group"></div>
    <div id="worldEnemyGroup" class="world-group is-enemy" hidden aria-label="Inspected enemy group"></div>
    <div id="traitTip" class="trait-tip" hidden aria-live="polite"></div>
    <div id="healthStrip" class="health-strip" hidden aria-label="Battle health"></div>
    <div id="battleHud" class="battle-hud" hidden>
      <div class="battle-row">
        <div id="battleReadout" class="battle-readout">Ready</div>
        <button id="waitTurn" type="button" title="Wait" aria-label="Wait">W</button>
      </div>
    </div>
    <script type="module" src="./src/main.js?v=battle-test-43"></script>
  </body>
</html>
